plugins { id 'com.android.application' }
android { namespace 'jp.dongurikobo.donix'; compileSdk 35
  defaultConfig { applicationId 'jp.dongurikobo.donix'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
android {
    signingConfigs {
        release {
            storeFile file(System.getenv("RUNNER_TEMP") + "/donix-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
